<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title"><title id="title">Follow one PR, then plan the next.</title><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><rect width="900" height="600" rx="18" fill="#f0f2eb"/><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#91a599"/></marker></defs><path d="M290 189H320" fill="none" stroke="#91a599" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M585 189H615" fill="none" stroke="#91a599" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M750 276V333" fill="none" stroke="#91a599" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M620 425H585" fill="none" stroke="#91a599" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M325 425H290" fill="none" stroke="#91a599" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M40 425H20V84H455V103" fill="none" stroke="#91a599" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="40" y="49" font-size="12" font-weight="400" fill="#5a6a63">THE WORKFLOW</text><rect x="40" y="112" width="240" height="154" rx="12" fill="#ffffff" stroke="#d7ded3"/><text x="60" y="141" font-size="11" font-weight="400" fill="#5a6a63">01   HUMAN + AGENT</text><text x="60" y="177" font-size="19" font-weight="550" fill="#20332e">Agree on direction</text><text x="60" y="228" font-size="12" font-weight="400" fill="#5a6a63">You agree on the goal and steps.</text><rect x="335" y="112" width="240" height="154" rx="12" fill="#ffffff" stroke="#d7ded3"/><text x="355" y="141" font-size="11" font-weight="400" fill="#5a6a63">02   AGENT</text><text x="355" y="177" font-size="19" font-weight="550" fill="#20332e">Design the next PR</text><text x="355" y="228" font-size="12" font-weight="400" fill="#5a6a63">The agent audits and plans this</text><text x="355" y="244.2" font-size="12" font-weight="400" fill="#5a6a63">PR.</text><rect x="630" y="112" width="240" height="154" rx="12" fill="#f2ede1" stroke="#d7ded3"/><text x="650" y="141" font-size="11" font-weight="400" fill="#5a6a63">03   HUMAN</text><text x="650" y="177" font-size="19" font-weight="550" fill="#20332e">Approve the boundaries</text><text x="650" y="228" font-size="12" font-weight="400" fill="#5a6a63">You approve the design and</text><text x="650" y="244.2" font-size="12" font-weight="400" fill="#5a6a63">contract.</text><rect x="630" y="348" width="240" height="154" rx="12" fill="#285c4e" stroke="#d7ded3"/><text x="650" y="377" font-size="11" font-weight="400" fill="#d0e4d6">04   AGENT</text><text x="650" y="413" font-size="19" font-weight="550" fill="#ffffff">Execute autonomously</text><text x="650" y="464" font-size="12" font-weight="400" fill="#d0e4d6">A fresh session builds and tests</text><text x="650" y="480.2" font-size="12" font-weight="400" fill="#d0e4d6">it.</text><rect x="335" y="348" width="240" height="154" rx="12" fill="#f2ede1" stroke="#d7ded3"/><text x="355" y="377" font-size="11" font-weight="400" fill="#5a6a63">05   HUMAN</text><text x="355" y="413" font-size="19" font-weight="550" fill="#20332e">Review, then authorize</text><text x="355" y="438.65" font-size="19" font-weight="550" fill="#20332e">merge</text><text x="355" y="464" font-size="12" font-weight="400" fill="#5a6a63">You review and authorize merge.</text><rect x="40" y="348" width="240" height="154" rx="12" fill="#ffffff" stroke="#d7ded3"/><text x="60" y="377" font-size="11" font-weight="400" fill="#5a6a63">06   AGENT</text><text x="60" y="413" font-size="19" font-weight="550" fill="#20332e">Update the parent plans</text><text x="60" y="464" font-size="12" font-weight="400" fill="#5a6a63">The agent updates the parent</text><text x="60" y="480.2" font-size="12" font-weight="400" fill="#5a6a63">plans.</text><text x="450" y="310" text-anchor="middle" font-size="13" fill="#285c4e">The agent fixes ordinary bugs; you decide changes to the agreement.</text><text x="450" y="560" text-anchor="middle" font-size="11" letter-spacing="1" fill="#5a6a63">MERGED FACTS INFORM THE NEXT PR</text></g></svg>
